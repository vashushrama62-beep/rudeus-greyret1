
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rudeus Greyrat | My Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(ellipse at 0% 20%, #30065b 0%, transparent 35%),
                radial-gradient(ellipse at 100% 75%, #28054d 0%, transparent 35%),
                #05030d;
            display: flex;
            justify-content: center;
            padding: 45px 18px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 780px;
            text-align: center;
        }

        /* Profile picture */

        .profile-ring {
            width: 210px;
            height: 210px;
            padding: 5px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(
                135deg,
                #ff3eaa,
                #a020ff,
                #236bff
            );
            box-shadow:
                0 0 25px #b300ff66,
                0 0 55px #8c00ff33;
        }

        .profile-ring img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
            border: 4px solid #090513;
            border-radius: 50%;
        }

        h1 {
            font-size: clamp(30px, 5vw, 48px);
            font-weight: 700;
            overflow-wrap: anywhere;
            background: linear-gradient(
                90deg, #ff64c7, #ffffff, #bd80ff
            );
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        .crown {
            color: #bb49ff;
            font-size: 30px;
        }

        .tagline {
            color: #c9b5ff;
            font-size: clamp(15px, 3vw, 22px);
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        .divider {
            width: 85px;
            height: 3px;
            margin: 0 auto 25px;
            background: linear-gradient(90deg, #ff27ce, #674dff);
            border-radius: 10px;
        }

        .quote {
            color: #d8caff;
            font-size: 19px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* Social media icons */

        .socials {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 32px;
        }

        .social {
            width: 78px;
            height: 78px;
            display: grid;
            place-items: center;
            border: 1px solid #8127ff;
            border-radius: 50%;
            color: #ff37cf;
            background: #0b0719;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .social svg {
            width: 35px;
            height: 35px;
            fill: currentColor;
        }

        .social:hover {
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 0 25px #a000ff66;
        }

        .telegram {
            color: #21a9ff;
            border-color: #075cff;
        }

        .youtube {
            color: #ff1744;
        }

        /* Link cards */

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 24px;
            min-height: 125px;
            padding: 20px 26px;
            border: 1px solid #7d16ff;
            border-radius: 27px;
            background: linear-gradient(
                110deg,
                #10091f,
                #0a0719 75%
            );
            color: white;
            text-decoration: none;
            text-align: left;
            transition: 0.3s ease;
        }

        .link-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 25px #8a00ff44;
        }

        .link-card.instagram-card {
            background: linear-gradient(
                110deg,
                #e9238b,
                #7900c5,
                #28008e
            );
            border-color: #ff47d5;
            box-shadow: 0 0 15px #c000ff22;
        }

        .link-icon {
            width: 85px;
            height: 85px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #d62cff, #7721ff);
        }

        .link-icon svg {
            width: 47px;
            height: 47px;
            fill: currentColor;
        }

        .link-icon.telegram-icon {
            background: linear-gradient(135deg, #25c6ff, #0876dd);
        }

        .link-icon.pinterest-icon {
            background: linear-gradient(135deg, #ff395b, #df003b);
        }

        .link-icon.youtube-icon {
            background: linear-gradient(135deg, #ff364c, #ed0035);
        }

        .link-info {
            flex: 1;
            min-width: 0;
        }

        .link-info h2 {
            font-size: 25px;
            font-weight: 500;
            margin-bottom: 9px;
        }

        .link-info p {
            color: #cdbaf7;
            font-size: 17px;
        }

        .instagram-card .link-info p {
            color: #ffe0f5;
        }

        .arrow {
            font-size: 40px;
            color: #d9b6ff;
            font-weight: 300;
        }

        /* Footer */

        footer {
            margin-top: 55px;
            color: #bda4f2;
            font-size: 16px;
        }

        .footer-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
            color: #b72bff;
            font-size: 27px;
        }

        .footer-divider span {
            width: 110px;
            height: 2px;
            background: linear-gradient(90deg, #8b19ff, #ff2ccf);
        }

        /* Mobile responsive */

        @media (max-width: 500px) {
            body {
                padding: 35px 14px;
            }

            .profile-ring {
                width: 165px;
                height: 165px;
            }

            .tagline {
                letter-spacing: 1px;
            }

            .quote {
                font-size: 16px;
            }

            .socials {
                gap: 13px;
            }

            .social {
                width: 59px;
                height: 59px;
            }

            .social svg {
                width: 27px;
                height: 27px;
            }

            .link-card {
                min-height: 95px;
                padding: 14px;
                gap: 14px;
                border-radius: 20px;
            }

            .link-icon {
                width: 58px;
                height: 58px;
                border-radius: 15px;
            }

            .link-icon svg {
                width: 34px;
                height: 34px;
            }

            .link-info h2 {
                font-size: 18px;
                margin-bottom: 7px;
            }

            .link-info p {
                font-size: 13px;
            }

            .arrow {
                font-size: 30px;
            }

            footer {
                font-size: 13px;
            }
        }
    </style>
</head>
